name: musicfrito_flutter
description: "Frito Music - Reproductor de música local y streaming YouTube Music en Flutter"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Audio & Media
  just_audio: ^0.9.36
  audio_service: ^0.18.12
  audio_session: ^0.1.18

  # Local Media scanning
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.0

  # Network & HTTP
  dio: ^5.4.1
  http: ^1.2.0
  crypto: ^3.0.3
  dart_des: ^1.0.2

  # Storage & Preferences
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  path: ^1.9.0

  # UI & Images
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  palette_generator: ^0.3.3+3

  # WebView (PoToken generation)
  webview_flutter: ^4.7.0

  # Cupertino Icons
  cupertino_icons: ^1.0.6
  path_provider_android: 2.2.15
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/potoken/
